<div class="data-cruncher">
    <div fw-id="drop_zone" class="dc-drop-zone" tabindex="0" role="button">
        <div class="dc-drop-icon f-icon-i">&#xe2c6;</div>
        <div class="dc-drop-title">Drop an Excel file here</div>
        <div class="dc-drop-text">or click to browse (.xlsx, .xls, .xlsm, .ods, .csv)</div>
        <div fw-id="file_name" class="dc-file-name"></div>
        <input fw-id="file_input" type="file" accept=".xlsx,.xls,.xlsm,.xlsb,.ods,.csv" hidden />
    </div>
    <div fw-id="columns_panel" class="dc-columns" hidden>
        <div class="dc-section-title">Columns found</div>
        <div fw-id="column_list" class="dc-column-list"></div>
        <div class="dc-selectors">
            <label fw-id="sheet_row" class="dc-selector" hidden>
                <span>Sheet</span>
                <select fw-id="select_sheet"></select>
            </label>
            <label class="dc-selector">
                <span>Date column</span>
                <select fw-id="select_date"></select>
            </label>
            <label class="dc-selector">
                <span>Time column (optional)</span>
                <select fw-id="select_time"></select>
            </label>
            <div class="dc-selector">
                <span>Gains columns</span>
                <div fw-id="gains_slot" class="dc-picker-slot"></div>
            </div>
            <div class="dc-selector">
                <span>Expenses columns</span>
                <div fw-id="expenses_slot" class="dc-picker-slot"></div>
            </div>
            <div fw-id="button_container" class="dc-button-container"></div>
        </div>
        <div class="dc-filters">
            <div class="dc-section-title">Exclude rows where</div>
            <div fw-id="filter_list" class="dc-filter-list"></div>
            <div fw-id="add_filter_container" class="dc-button-container"></div>
        </div>
        <div fw-id="status" class="dc-status"></div>
    </div>
    <div fw-id="chart_container" class="dc-chart" hidden></div>
    <div fw-id="heatmap_container" class="dc-heatmap-container" hidden></div>
</div>
