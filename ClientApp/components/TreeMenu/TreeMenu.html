<div class="tree-menu">
    <div class="tree-menu-header" fw-id="header">
        <span class="tree-menu-title" fw-id="title"></span>
        <div class="tree-menu-header-actions" fw-id="header_actions"></div>
    </div>
    <div class="tree-menu-find" fw-id="find_bar">
        <div class="f-icon-i tree-menu-find-icon">&#xe8b6;</div>
        <input class="tree-menu-find-input" fw-id="find_input" type="text" spellcheck="false" autocomplete="off" placeholder="{{Find}}">
        <span class="tree-menu-find-count" fw-id="find_count"></span>
        <div class="f-icon-i tree-menu-icon-button" fw-id="find_mode_button">&#xe152;</div>
        <div class="f-icon-i tree-menu-icon-button" fw-id="find_close_button">&#xe5cd;</div>
    </div>
    <div class="tree-menu-body">
        <div class="tree-menu-viewport" fw-id="viewport" role="tree" tabindex="0">
            <div class="tree-menu-canvas" fw-id="canvas"></div>
        </div>
        <div class="tree-menu-sticky" fw-id="sticky"></div>
        <div class="tree-menu-state" fw-id="state"></div>
    </div>
</div>
