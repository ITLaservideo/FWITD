<div class="date-picker-container">
    <div class="dp-interval-edges" fw-id="interval-edges">
        <div class="dp-interval-edge dp-interval-edge-active" fw-id="edge-start" (click)="onClickEdgeStart">
            <div class="dp-interval-edge-label">inizio</div>
            <div fw-id="edge-start-text"></div>
        </div>
        <div class="f-icon-i">&#xe5c8;</div>
        <div class="dp-interval-edge" fw-id="edge-end" (click)="onClickEdgeEnd">
            <div class="dp-interval-edge-label">fine</div>
            <div fw-id="edge-end-text"></div>
        </div>
    </div>
    <div class="dp-fields">
        <div class="dp-fields-date">
            <input type="text" inputmode="numeric" autocomplete="off" class="dp-field" fw-id="input-day" maxlength="2" placeholder="gg" />/
            <input type="text" autocomplete="off" class="dp-field" fw-id="input-month" maxlength="2" placeholder="mm" />/
            <input type="text" inputmode="numeric" autocomplete="off" class="dp-field dp-field-year" fw-id="input-year" maxlength="4" placeholder="aaaa" />
        </div>
        <div class="dp-fields-time" fw-id="fields-time">
            <input type="text" inputmode="numeric" autocomplete="off" class="dp-field" fw-id="input-hour" maxlength="2" placeholder="hh" />:
            <input type="text" inputmode="numeric" autocomplete="off" class="dp-field" fw-id="input-minutes" maxlength="2" placeholder="mm" /><span class="dp-seconds-separator">:</span>
            <input type="text" inputmode="numeric" autocomplete="off" class="dp-field dp-seconds" fw-id="input-seconds" maxlength="2" placeholder="ss" />
        </div>
    </div>
    <div class="time-selections" fw-id="time-selections">
        <div fw-id="time-container-hour">
            <div (click)="onClickTimer1Previous" class="f-icon-i">&#xe5cb;</div>
            <span fw-id="timer1-text">5</span>
            <div (click)="onClickTimer1Next" class="f-icon-i">&#xe5cc;</div>
        </div>:
        <div fw-id="time-container-minutes">
            <div (click)="onClickTimer2Previous" class="f-icon-i">&#xe5cb;</div>
            <span fw-id="timer2-text">5</span>
            <div (click)="onClickTimer2Next" class="f-icon-i">&#xe5cc;</div>
        </div><span class="dp-seconds-separator">:</span>
        <div class="dp-seconds" fw-id="time-container-seconds">
            <div (click)="onClickTimer3Previous" class="f-icon-i">&#xe5cb;</div>
            <span fw-id="timer3-text">5</span>
            <div (click)="onClickTimer3Next" class="f-icon-i">&#xe5cc;</div>
        </div>
        <div class="dp-time-shortcuts">
            <div class="ez-button" (click)="onClickFineGiornata">
                <div class="f-icon-i">&#xe01f;</div>fine giornata
            </div>
            <div class="ez-button" (click)="onClickInizioGiornata">
                <div class="f-icon-i">&#xe020;</div>inizio giornata
            </div>
            <div class="ez-button" (click)="onClickOraCorrente">
                <div class="f-icon-i">&#xe5d5;</div>ora attuale
            </div>
        </div>
    </div>
    <div class="divisorio"></div>
    <div class="date-picker-header">
        <div (click)="onClickPreviousMonth" class="f-icon-i">&#xe5cb;</div>
        <div fw-id="month-text" (click)="onClickMonthText" class="month-text">currentMonth</div>
        <div fw-id="year-text" (click)="onClickYearText" class="year-text">2026</div>
        <div (click)="onClickNextMonth" class="f-icon-i">&#xe5cc;</div>
    </div>
    <div fw-id="body-selections" class="body-selections"></div>
</div>
