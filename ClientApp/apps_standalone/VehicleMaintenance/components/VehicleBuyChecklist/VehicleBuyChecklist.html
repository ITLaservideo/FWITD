<div class="vbc-overlay">
    <div class="vbc-header">
        <div class="vbc-header-main">
            <div fw-id="title" class="vbc-title"></div>
            <div fw-id="progress_text" class="vbc-progress-text"></div>
        </div>
        <div fw-id="type_switch" class="vbc-type-switch"></div>
        <div class="vbc-header-actions">
            <button fw-id="btn_reset" class="vbc-header-btn" title="Start over"><div class="f-icon-i">&#xe5d5;</div></button>
            <button fw-id="btn_close" class="vbc-header-btn" title="Close"><div class="f-icon-i">&#xe5cd;</div></button>
        </div>
    </div>
    <div class="vbc-progress"><div fw-id="progress_bar" class="vbc-progress-fill"></div></div>
    <div class="vbc-body">
        <div fw-id="sections_container" class="vbc-sections"></div>
        <div class="vbc-section">
            <div fw-id="notes_title" class="vbc-section-title"></div>
            <textarea fw-id="notes" class="vbc-notes" rows="4"></textarea>
        </div>
    </div>
</div>
